<!DOCTYPE html>
<html>
<head>
    <title>Vinnie Little Car Game</title>
<style>
        body {
            margin: 1;
            background: #400;
            overflow: hidden;
            font-family: Arial;   
        }
     #game {
            width: 600px;
            height: 500px;
            background: #300;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            border: 6px solid blue;
         }
    #car{
        width: 600px
          height: 90px;
            background: blue;
            position: absolute;
            bottom: 60px;
            left: 175px;
            border-radius: 30px;
        }
        .line {
            width: 10px;
            height: 80px;
            background: white;
            position: absolute;
            left: 195px;
        }

        #score {
            color: white;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div id="score">Score: 0</div>

    <div id="game">
        <div class="line" style="top: 0px;"></div>
        <div class="line" style="top: 150px;"></div>
        <div class="line" style="top: 300px;"></div>
        <div class="line" style="top: 450px;"></div>

        <div id="car"></div>
    </div>

    <script>
        const car = document.getElementById("car");

        let carX = 175;
        let score = 0;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowLeft" && carX > 10) {
                carX -= 10;
            }

            if (event.key === "ArrowRight" && carX < 340) {
                carX += 10;
            }

            car.style.left = carX + "px";
        });

        setInterval(function() {
            score++;
            document.getElementById("score").textContent =
                "Score: " + score;
        }, 100);
    </script>

</body>
</html>
