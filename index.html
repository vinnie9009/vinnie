<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Crash Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
        text-align: center;
        color: white;
    }

    #game {
        position: relative;
        width: 400px;
        height: 700px;
        max-width: 100vw;
        max-height: 100vh;
        margin: auto;
        overflow: hidden;
        background: #333;
        border-left: 8px solid #555;
        border-right: 8px solid #555;
    }

    #road {
        position: absolute;
        width: 100%;
        height: 100%;
        background:
            linear-gradient(
                to right,
                #555 0%,
                #555 8%,
                #292929 8%,
                #292929 92%,
                #555 92%,
                #555 100%
            );
    }

    .line {
        position: absolute;
        width: 8px;
        height: 90px;
        background: white;
        left: 50%;
        transform: translateX(-50%);
    }

    #player {
        position: absolute;
        width: 55px;
        height: 95px;
        bottom: 40px;
        left: 172px;
        background: #e22;
        border-radius: 12px;
        border: 4px solid #111;
        z-index: 10;
    }

    #player::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 32px;
        left: 6px;
        top: 10px;
        background: #55b7e8;
        border: 3px solid #111;
        border-radius: 6px;
    }

    #player::after {
        content: "";
        position: absolute;
        width: 39px;
        height: 25px;
        left: 4px;
        bottom: 8px;
        background: #333;
        border-radius: 5px;
    }

    .enemy {
        position: absolute;
        width: 55px;
        height: 95px;
        background: #1685e5;
        border-radius: 12px;
        border: 4px solid #111;
        z-index: 5;
    }

    .enemy::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 32px;
        left: 6px;
        top: 10px;
        background: #9de5ff;
        border: 3px solid #111;
        border-radius: 6px;
    }

    .enemy::after {
        content: "";
        position: absolute;
        width: 39px;
        height: 25px;
        left: 4px;
        bottom: 8px;
        background: #333;
        border-radius: 5px;
    }

    #score {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 20;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px #000;
    }

    #gameOver {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.85);
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    #gameOver h1 {
        color: #ff3333;
        font-size: 50px;
        margin: 10px;
    }

    #finalScore {
        font-size: 24px;
        margin: 10px;
    }

    button {
        padding: 15px 30px;
        border: none;
        border-radius: 10px;
        background: #22cc55;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #19a947;
    }

    #controls {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 30px;
        z-index: 200;
    }

    .control {
        width: 75px;
        height: 60px;
        background: rgba(255,255,255,0.25);
        color: white;
        border: 2px solid white;
        border-radius: 12px;
        font-size: 30px;
        user-select: none;
        touch-action: manipulation;
    }

    @media (min-width: 700px) {
        #controls {
            display: none;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="score">Score: 0</div>

    <div id="player"></div>

    <div id="gameOver">

        <h1>GAME OVER</h1>

        <div id="finalScore">
            Score: 0
        </div>

        <button
            id="restartButton"
            type="button">
            RESTART
        </button>

    </div>

</div>

<div id="controls">

    <button
        class="control"
        id="left"
        type="button">
        ⬅️
    </button>

    <button
        class="control"
        id="right"
        type="button">
        ➡️
    </button>

</div>


<!-- =====================================================
     MUSIC FILES

     These files MUST be in the same folder as index.html:

     driving-music.mp3
     nikes-on-my-feet.mp3
     ===================================================== -->

<audio
    id="drivingMusic"
    loop
    preload="auto">

    <source
        src="driving-music.mp3"
        type="audio/mpeg">

</audio>


<audio
    id="deathMusic"
    preload="auto">

    <source
        src="nikes-on-my-feet.mp3"
        type="audio/mpeg">

</audio>


<script>

/* =========================================================
   GAME ELEMENTS
   ========================================================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const drivingMusic =
    document.getElementById("drivingMusic");

const deathMusic =
    document.getElementById("deathMusic");

const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");

const restartButton =
    document.getElementById("restartButton");


/* =========================================================
   GAME VARIABLES
   ========================================================= */

let playerX = 172;

let score = 0;

let speed = 5;

let gameRunning = true;

let enemies = [];

let lines = [];

let animationFrame;

let spawnTimer;

let scoreTimer;


/* =========================================================
   AUDIO VARIABLES
   ========================================================= */

let audioContext = null;

let engineOscillator = null;

let engineGain = null;

let soundStarted = false;

let audioUnlocked = false;


/* =========================================================
   UNLOCK AUDIO
   =========================================================

   Browsers such as Safari and Chrome can block audio
   until the player interacts with the page.

   We unlock BOTH songs during the first interaction.
   ========================================================= */

async function unlockAudio() {

    if (audioUnlocked) {
        return;
    }

    audioUnlocked = true;


    /* Web Audio */

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state === "suspended"
        ) {

            await audioContext.resume();

        }

    } catch (error) {

        console.warn(
            "Web Audio error:",
            error
        );

    }


    /*
       Unlock driving music.
    */

    try {

        drivingMusic.volume = 0;

        await drivingMusic.play();

        drivingMusic.pause();

        drivingMusic.currentTime = 0;

        drivingMusic.volume = 0.35;

    } catch (error) {

        console.warn(
            "Driving music unlock failed:",
            error
        );

    }


    /*
       Unlock death music.
    */

    try {

        deathMusic.volume = 0;

        await deathMusic.play();

        deathMusic.pause();

        deathMusic.currentTime = 0;

        deathMusic.volume = 0.5;

    } catch (error) {

        console.warn(
            "Death music unlock failed:",
            error
        );

    }

}


/* =========================================================
   START DRIVING MUSIC
   ========================================================= */

async function startMusic() {

    if (!gameRunning) {
        return;
    }


    /* Stop death music */

    deathMusic.pause();

    deathMusic.currentTime = 0;


    drivingMusic.volume = 0.35;


    try {

        await drivingMusic.play();

    } catch (error) {

        console.error(
            "Driving music failed:",
            error
        );

    }

}


/* =========================================================
   STOP DRIVING MUSIC
   ========================================================= */

function stopMusic() {

    drivingMusic.pause();

    drivingMusic.currentTime = 0;

}


/* =========================================================
   PLAY DEATH MUSIC
   ========================================================= */

async function playDeathMusic() {

    /*
       Make absolutely sure driving music is stopped.
    */

    drivingMusic.pause();

    drivingMusic.currentTime = 0;


    /*
       Reset death music.
    */

    deathMusic.pause();

    deathMusic.currentTime = 0;

    deathMusic.volume = 0.5;


    try {

        await deathMusic.play();

        console.log(
            "Death music is playing!"
        );

    } catch (error) {

        console.error(
            "DEATH MUSIC FAILED:",
            error
        );

        console.error(
            "Make sure nikes-on-my-feet.mp3 is beside index.html."
        );

    }

}


/* =========================================================
   ENGINE SOUND
   ========================================================= */

async function startAudio() {

    if (soundStarted) {
        return;
    }


    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioContext.state === "suspended"
        ) {

            await audioContext.resume();

        }


        engineOscillator =
            audioContext.createOscillator();

        engineGain =
            audioContext.createGain();


        engineOscillator.type =
            "sawtooth";

        engineOscillator.frequency.value =
            80;

        engineGain.gain.value =
            0.025;


        engineOscillator.connect(
            engineGain
        );

        engineGain.connect(
            audioContext.destination
        );


        engineOscillator.start();

        soundStarted = true;

    } catch (error) {

        console.warn(
            "Engine sound failed:",
            error
        );

    }

}


/* =========================================================
   STOP ENGINE
   ========================================================= */

function stopEngineSound() {

    if (
        !soundStarted ||
        !engineOscillator ||
        !audioContext
    ) {
        return;
    }


    try {

        engineGain.gain.setTargetAtTime(
            0.001,
            audioContext.currentTime,
            0.03
        );


        engineOscillator.stop(
            audioContext.currentTime + 0.1
        );

    } catch (error) {

        console.warn(
            "Engine stop error:",
            error
        );

    }


    engineOscillator = null;

    engineGain = null;

    soundStarted = false;

}


/* =========================================================
   ENGINE UPDATE
   ========================================================= */

function updateEngineSound() {

    if (
        !soundStarted ||
        !engineOscillator ||
        !audioContext
    ) {
        return;
    }


    const engineSpeed =
        70 + speed * 12;


    engineOscillator.frequency.setTargetAtTime(
        engineSpeed,
        audioContext.currentTime,
        0.05
    );

}


/* =========================================================
   SOUND EFFECT
   ========================================================= */

function playTone(
    frequency,
    duration,
    type = "square",
    volume = 0.08
) {

    if (
        !soundStarted ||
        !audioContext
    ) {
        return;
    }


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );

}


/* =========================================================
   MOVE SOUND
   ========================================================= */

function playMoveSound() {

    playTone(
        350,
        0.08,
        "square",
        0.04
    );

}


/* =========================================================
   SCORE SOUND
   ========================================================= */

function playScoreSound() {

    playTone(
        700,
        0.08,
        "sine",
        0.04
    );


    setTimeout(() => {

        if (
            soundStarted &&
            gameRunning
        ) {

            playTone(
                900,
                0.1,
                "sine",
                0.04
            );

        }

    }, 70);

}


/* =========================================================
   CRASH SOUND
   ========================================================= */

function playCrashSound() {

    if (!audioContext) {
        return;
    }


    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sawtooth";


        oscillator.frequency.setValueAtTime(
            180,
            audioContext.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            40,
            audioContext.currentTime + 0.7
        );


        gain.gain.setValueAtTime(
            0.35,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.7
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.7
        );


        /* Impact sound */

        const impact =
            audioContext.createOscillator();

        const impactGain =
            audioContext.createGain();


        impact.type =
            "square";

        impact.frequency.value =
            70;


        impactGain.gain.setValueAtTime(
            0.2,
            audioContext.currentTime
        );


        impactGain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.4
        );


        impact.connect(
            impactGain
        );

        impactGain.connect(
            audioContext.destination
        );


        impact.start();

        impact.stop(
            audioContext.currentTime + 0.4
        );

    } catch (error) {

        console.warn(
            "Crash sound failed:",
            error
        );

    }

}


/* =========================================================
   ROAD LINES
   ========================================================= */

for (let i = 0; i < 8; i++) {

    const line =
        document.createElement("div");

    line.className =
        "line";

    line.style.top =
        (i * 100 - 100) + "px";

    game.appendChild(line);

    lines.push(line);

}


/* =========================================================
   MOVE LEFT
   ========================================================= */

async function moveLeft() {

    await unlockAudio();

    await startAudio();

    await startMusic();


    if (!gameRunning) {
        return;
    }


    playerX -= 30;


    const minimum =
        game.clientWidth * 0.08;


    if (playerX < minimum) {
        playerX = minimum;
    }


    player.style.left =
        playerX + "px";


    playMoveSound();

}


/* =========================================================
   MOVE RIGHT
   ========================================================= */

async function moveRight() {

    await unlockAudio();

    await startAudio();

    await startMusic();


    if (!gameRunning) {
        return;
    }


    playerX += 30;


    const maximum =
        game.clientWidth -
        55 -
        game.clientWidth * 0.08;


    if (playerX > maximum) {
        playerX = maximum;
    }


    player.style.left =
        playerX + "px";


    playMoveSound();

}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            event.preventDefault();

            moveLeft();

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            event.preventDefault();

            moveRight();

        }

    }
);


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

leftButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        moveLeft();

    }
);


rightButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        moveRight();

    }
);


/* =========================================================
   COLLISION
   ========================================================= */

function collision(a, b) {

    const aRect =
        a.getBoundingClientRect();

    const bRect =
        b.getBoundingClientRect();


    return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
    );

}


/* =========================================================
   CREATE ENEMY
   ========================================================= */

function createEnemy() {

    if (!gameRunning) {
        return;
    }


    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";


    const lanes = [
        55,
        172,
        289
    ];


    const randomLane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    enemy.style.left =
        randomLane + "px";

    enemy.style.top =
        "-120px";


    game.appendChild(enemy);


    enemies.push({

        element: enemy,

        x: randomLane,

        y: -120,

        dx:
            (Math.random() * 2 - 1) * 2

    });

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    /* Move road lines */

    lines.forEach(line => {

        let top =
            parseFloat(
                line.style.top
            );


        top += speed;


        if (top > 700) {
            top = -90;
        }


        line.style.top =
            top + "px";

    });


    /* Move enemies backwards */

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        enemy.y += speed;

        enemy.x += enemy.dx;


        if (enemy.x < 38) {

            enemy.x = 38;

            enemy.dx *= -1;

        }


        if (
            enemy.x >
            game.clientWidth -
            55 -
            38
        ) {

            enemy.x =
                game.clientWidth -
                55 -
                38;

            enemy.dx *= -1;

        }


        enemy.element.style.top =
            enemy.y + "px";


        enemy.element.style.left =
            enemy.x + "px";


        /* Check crash */

        if (
            collision(
                player,
                enemy.element
            )
        ) {

            endGame();

            return;

        }


        /* Enemy passed */

        if (enemy.y > 750) {

            enemy.element.remove();

            enemies.splice(
                i,
                1
            );


            score += 10;


            scoreText.textContent =
                "Score: " + score;


            playScoreSound();

        }

    }


    updateEngineSound();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   SPAWN ENEMIES
   ========================================================= */

spawnTimer =
    setInterval(
        function() {

            if (gameRunning) {
                createEnemy();
            }

        },
        1200
    );


/* =========================================================
   SCORE
   ========================================================= */

scoreTimer =
    setInterval(
        function() {

            if (!gameRunning) {
                return;
            }


            score++;


            scoreText.textContent =
                "Score: " + score;


            if (score % 50 === 0) {

                speed += 0.5;

            }

        },
        1000
    );


/* =========================================================
   GAME OVER
   ========================================================= */

async function endGame() {

    if (!gameRunning) {
        return;
    }


    gameRunning = false;


    /* Stop game loop */

    cancelAnimationFrame(
        animationFrame
    );


    /* Stop timers */

    clearInterval(
        spawnTimer
    );

    clearInterval(
        scoreTimer
    );


    /* Stop engine */

    stopEngineSound();


    /* Stop driving music */

    stopMusic();


    /* Show game over */

    finalScore.textContent =
        "Score: " + score;


    gameOverScreen.style.display =
        "flex";


    /* Crash sound */

    playCrashSound();


    /*
       Play the death music immediately.
       Because the audio was unlocked when the
       player first interacted with the game,
       this is much more reliable on Safari/Chrome.
    */

    await playDeathMusic();

}


/* =========================================================
   RESTART GAME
   ========================================================= */

async function restartGame() {

    /* Stop old animation */

    cancelAnimationFrame(
        animationFrame
    );


    /* Stop timers */

    clearInterval(
        spawnTimer
    );

    clearInterval(
        scoreTimer
    );


    /* Stop music */

    stopMusic();

    deathMusic.pause();

    deathMusic.currentTime = 0;


    /* Stop engine */

    stopEngineSound();


    /* Remove all enemies */

    enemies.forEach(enemy => {

        enemy.element.remove();

    });


    enemies = [];


    /* Reset game */

    score = 0;

    speed = 5;

    gameRunning = true;


    /* Reset player */

    playerX = 172;

    player.style.left =
        playerX + "px";


    /* Reset score */

    scoreText.textContent =
        "Score: 0";


    /* Hide game over */

    gameOverScreen.style.display =
        "none";


    /* Restart audio */

    await unlockAudio();

    await startAudio();

    await startMusic();


    /* Restart timers */

    spawnTimer =
        setInterval(
            function() {

                if (gameRunning) {
                    createEnemy();
                }

            },
            1200
        );


    scoreTimer =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }


                score++;

                scoreText.textContent =
                    "Score: " + score;


                if (score % 50 === 0) {
                    speed += 0.5;
                }

            },
            1000
        );


    /* Restart game loop */

    gameLoop();

}


/* =========================================================
   RESTART BUTTON
   ========================================================= */

restartButton.addEventListener(
    "click",
    function() {

        restartGame();

    }
);


/* =========================================================
   FIRST INTERACTION

   Unlock audio as soon as the player touches/clicks
   the game or presses a key.
   ========================================================= */

document.addEventListener(
    "pointerdown",
    function() {

        unlockAudio();

    },
    {
        once: true
    }
);


document.addEventListener(
    "keydown",
    function() {

        unlockAudio();

    },
    {
        once: true
    }
);


/* =========================================================
   START GAME
   ========================================================= */

gameLoop();

</script>

</body>
</html>
