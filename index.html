<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Crash Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
    color: white;
}

#game {
    position: relative;
    width: 400px;
    height: 700px;
    max-width: 100vw;
    max-height: 100vh;
    margin: auto;
    overflow: hidden;
    background: #333;
    border-left: 8px solid #555;
    border-right: 8px solid #555;
}


/* =========================================================
   ROAD
   ========================================================= */

#road {
    position: absolute;
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            to right,
            #555 0%,
            #555 8%,
            #292929 8%,
            #292929 92%,
            #555 92%,
            #555 100%
        );
}

#road::before,
#road::after {
    content: "";
    position: absolute;
    top: 0;
    width: 5px;
    height: 100%;
    background: #ddd;
    opacity: 0.45;
}

#road::before {
    left: 8%;
}

#road::after {
    right: 8%;
}


/* =========================================================
   ROAD LINES
   ========================================================= */

.line {
    position: absolute;
    width: 8px;
    height: 90px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 4px;
    box-shadow: 0 0 4px rgba(255,255,255,0.4);
}


/* =========================================================
   CARS
   ========================================================= */

#player,
.enemy {

    position: absolute;

    width: 58px;
    height: 100px;

    border-radius:
        15px 15px 11px 11px;

    border: 3px solid #111;

    overflow: visible;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,0.3),
            rgba(255,255,255,0.12) 18%,
            transparent 38%,
            transparent 62%,
            rgba(0,0,0,0.28)
        ),
        var(--car-color);

    box-shadow:
        0 7px 10px rgba(0,0,0,0.7),
        inset 3px 0 4px rgba(255,255,255,0.2),
        inset -3px 0 5px rgba(0,0,0,0.3);
}


/* =========================================================
   PLAYER
   ========================================================= */

#player {

    --car-color: #e51f2a;

    left: 172px;
    bottom: 40px;

    z-index: 10;

    transition:
        transform 0.1s ease;
}


/* =========================================================
   WINDOWS
   ========================================================= */

#player::before,
.enemy::before {

    content: "";

    position: absolute;

    width: 38px;
    height: 39px;

    left: 7px;
    top: 10px;

    background:
        linear-gradient(
            135deg,
            #d8f8ff 0%,
            #62b9df 40%,
            #17394e 100%
        );

    border: 3px solid #111;

    border-radius:
        10px 10px 5px 5px;

    box-shadow:
        inset 3px 3px 4px
        rgba(255,255,255,0.4),

        inset -4px -4px 6px
        rgba(0,0,0,0.35);
}


/* =========================================================
   WHEELS
   ========================================================= */

.wheel {

    position: absolute;

    width: 9px;
    height: 26px;

    background:
        linear-gradient(
            to right,
            #050505,
            #444,
            #080808
        );

    border-radius: 5px;

    border: 1px solid #000;

    box-shadow:
        1px 1px 2px #000;

    z-index: -1;
}

.wheel.left {
    left: -8px;
    top: 19px;
}

.wheel.right {
    right: -8px;
    top: 19px;
}

.wheel.left.rear {
    left: -8px;
    top: 68px;
}

.wheel.right.rear {
    right: -8px;
    top: 68px;
}

.wheel::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 13px;

    left: 1px;
    top: 5px;

    background: #888;

    border-radius: 3px;

    box-shadow:
        inset 1px 0 #ddd;
}


/* =========================================================
   LIGHTS
   ========================================================= */

.headlight {

    position: absolute;

    width: 11px;
    height: 7px;

    top: 4px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #ffe98a
        );

    border-radius: 4px;

    border: 1px solid #aaa;

    box-shadow:
        0 0 5px #fff,
        0 0 10px
        rgba(255,240,150,0.8);

    z-index: 2;
}

.headlight.left {
    left: 5px;
}

.headlight.right {
    right: 5px;
}

.taillight {

    position: absolute;

    width: 11px;
    height: 7px;

    bottom: 5px;

    background:
        linear-gradient(
            to bottom,
            #ff5555,
            #b40000
        );

    border-radius: 3px;

    box-shadow:
        0 0 5px rgba(255,0,0,0.7);
}

.taillight.left {
    left: 5px;
}

.taillight.right {
    right: 5px;
}


/* =========================================================
   MIRRORS
   ========================================================= */

.mirror {

    position: absolute;

    width: 8px;
    height: 11px;

    top: 37px;

    background:
        linear-gradient(
            135deg,
            #222,
            #777
        );

    border: 2px solid #111;

    border-radius: 3px;

    z-index: 2;
}

.mirror.left {
    left: -9px;
}

.mirror.right {
    right: -9px;
}


/* =========================================================
   DOORS
   ========================================================= */

.door-line {

    position: absolute;

    width: 1px;
    height: 40px;

    top: 45px;

    background:
        rgba(0,0,0,0.35);
}

.door-line.left {
    left: 8px;
}

.door-line.right {
    right: 8px;
}

.door-handle {

    position: absolute;

    width: 7px;
    height: 2px;

    background: #aaa;

    border-radius: 2px;

    top: 51px;
}

.door-handle.left {
    left: 10px;
}

.door-handle.right {
    right: 10px;
}


/* =========================================================
   RACING STRIPE
   ========================================================= */

.stripe {

    position: absolute;

    width: 6px;
    height: 96px;

    left: 26px;
    top: 1px;

    background:
        rgba(255,255,255,0.18);

    border-radius: 4px;

    pointer-events: none;
}


/* =========================================================
   SPOILER
   ========================================================= */

.spoiler {

    position: absolute;

    width: 45px;
    height: 6px;

    left: 4px;
    bottom: -5px;

    background:
        linear-gradient(
            to bottom,
            #333,
            #080808
        );

    border-radius: 4px;

    box-shadow:
        0 2px 3px #000;
}


/* =========================================================
   BUMPER
   ========================================================= */

.bumper {

    position: absolute;

    left: 3px;
    right: 3px;

    bottom: -3px;

    height: 9px;

    background:
        linear-gradient(
            to bottom,
            #333,
            #080808
        );

    border-radius:
        0 0 8px 8px;

    border-top:
        2px solid rgba(255,255,255,0.15);
}


/* =========================================================
   SCORE
   ========================================================= */

#score {

    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 20;

    font-size: 24px;
    font-weight: bold;

    text-shadow:
        2px 2px #000;
}


/* =========================================================
   GAME OVER
   ========================================================= */

#gameOver {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 100;

    background:
        rgba(0,0,0,0.8);

    align-items: center;
    justify-content: center;

    flex-direction: column;
}

#gameOver h1 {

    color: #ff3333;

    font-size: 50px;

    margin: 10px;

    text-shadow:
        3px 3px #000;
}

#finalScore {

    font-size: 24px;

    margin: 10px;
}

#bestScore {

    font-size: 24px;

    margin:
        5px 10px 20px;

    color: #ffd700;

    font-weight: bold;

    text-shadow:
        2px 2px #000;
}


/* =========================================================
   BUTTONS
   ========================================================= */

button {

    padding:
        15px 30px;

    border: none;

    border-radius: 10px;

    background:
        #22cc55;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #19a947;
}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

#controls {

    position: fixed;

    bottom: 15px;
    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 30px;

    z-index: 200;
}

.control {

    width: 75px;
    height: 60px;

    background:
        rgba(255,255,255,0.25);

    color: white;

    border:
        2px solid white;

    border-radius: 12px;

    font-size: 30px;

    user-select: none;
}

@media (min-width: 700px) {

    #controls {
        display: none;
    }

}

</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="score">
        Score: 0
    </div>


    <!-- PLAYER CAR -->

    <div id="player">

        <div class="wheel left"></div>
        <div class="wheel right"></div>

        <div class="wheel left rear"></div>
        <div class="wheel right rear"></div>

        <div class="headlight left"></div>
        <div class="headlight right"></div>

        <div class="taillight left"></div>
        <div class="taillight right"></div>

        <div class="mirror left"></div>
        <div class="mirror right"></div>

        <div class="door-line left"></div>
        <div class="door-line right"></div>

        <div class="door-handle left"></div>
        <div class="door-handle right"></div>

        <div class="stripe"></div>

        <div class="spoiler"></div>

        <div class="bumper"></div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>
            GAME OVER
        </h1>

        <div id="finalScore">
            Score: 0
        </div>

        <div id="bestScore">
            Best: 0
        </div>

        <button onclick="restartGame()">
            RESTART
        </button>

    </div>

</div>


<div id="controls">

    <button
        class="control"
        id="left">
        ⬅️
    </button>

    <button
        class="control"
        id="right">
        ➡️
    </button>

</div>


<script>

/* =========================================================
   SOUND SYSTEM
   ========================================================= */

let audioContext;

let engineLow;
let engineMid;
let engineHigh;

let engineLowGain;
let engineMidGain;
let engineHighGain;

let soundStarted = false;


/* =========================================================
   START / RESTART ENGINE SOUND
   ========================================================= */

function startAudio() {

    if (
        soundStarted &&
        audioContext
    ) {

        if (
            audioContext.state === "suspended"
        ) {
            audioContext.resume();
        }

        return;
    }


    if (
        !audioContext ||
        audioContext.state === "closed"
    ) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    /* LOW ENGINE */

    engineLow =
        audioContext.createOscillator();

    engineLowGain =
        audioContext.createGain();

    engineLow.type =
        "sine";

    engineLow.frequency.value =
        55;

    engineLowGain.gain.value =
        0.10;

    engineLow.connect(
        engineLowGain
    );

    engineLowGain.connect(
        audioContext.destination
    );


    /* MAIN ENGINE */

    engineMid =
        audioContext.createOscillator();

    engineMidGain =
        audioContext.createGain();

    engineMid.type =
        "sawtooth";

    engineMid.frequency.value =
        110;

    engineMidGain.gain.value =
        0.025;

    engineMid.connect(
        engineMidGain
    );

    engineMidGain.connect(
        audioContext.destination
    );


    /* HIGH ENGINE */

    engineHigh =
        audioContext.createOscillator();

    engineHighGain =
        audioContext.createGain();

    engineHigh.type =
        "triangle";

    engineHigh.frequency.value =
        165;

    engineHighGain.gain.value =
        0.01;

    engineHigh.connect(
        engineHighGain
    );

    engineHighGain.connect(
        audioContext.destination
    );


    /* START */

    engineLow.start();
    engineMid.start();
    engineHigh.start();


    soundStarted = true;

}


/* =========================================================
   UPDATE ENGINE SOUND
   ========================================================= */

function updateEngineSound() {

    if (
        !soundStarted ||
        !audioContext
    ) {
        return;
    }


    const rpm =
        55 + speed * 14;

    const now =
        audioContext.currentTime;


    engineLow.frequency.setTargetAtTime(
        rpm,
        now,
        0.04
    );

    engineMid.frequency.setTargetAtTime(
        rpm * 2,
        now,
        0.04
    );

    engineHigh.frequency.setTargetAtTime(
        rpm * 3,
        now,
        0.04
    );


    const lowVolume =
        0.10 + speed * 0.003;

    const midVolume =
        0.025 + speed * 0.002;

    const highVolume =
        0.01 + speed * 0.001;


    engineLowGain.gain.setTargetAtTime(
        Math.min(lowVolume, 0.18),
        now,
        0.08
    );

    engineMidGain.gain.setTargetAtTime(
        Math.min(midVolume, 0.07),
        now,
        0.08
    );

    engineHighGain.gain.setTargetAtTime(
        Math.min(highVolume, 0.04),
        now,
        0.08
    );

}


/* =========================================================
   STOP ENGINE COMPLETELY
   ========================================================= */

function stopEngineSound() {

    if (
        !soundStarted ||
        !audioContext
    ) {
        return;
    }


    const now =
        audioContext.currentTime;


    /* Fade out immediately */

    engineLowGain.gain.cancelScheduledValues(now);
    engineMidGain.gain.cancelScheduledValues(now);
    engineHighGain.gain.cancelScheduledValues(now);


    engineLowGain.gain.setTargetAtTime(
        0,
        now,
        0.015
    );

    engineMidGain.gain.setTargetAtTime(
        0,
        now,
        0.015
    );

    engineHighGain.gain.setTargetAtTime(
        0,
        now,
        0.015
    );


    /*
       Completely stop the oscillators.
       This prevents the engine from
       continuing after GAME OVER.
    */

    setTimeout(() => {

        try {
            engineLow.stop();
        } catch (e) {}

        try {
            engineMid.stop();
        } catch (e) {}

        try {
            engineHigh.stop();
        } catch (e) {}


        try {
            engineLow.disconnect();
            engineMid.disconnect();
            engineHigh.disconnect();

            engineLowGain.disconnect();
            engineMidGain.disconnect();
            engineHighGain.disconnect();

        } catch (e) {}

    }, 80);


    soundStarted = false;

}


/* =========================================================
   TONE
   ========================================================= */

function playTone(
    frequency,
    duration,
    type = "square",
    volume = 0.08
) {

    if (
        !soundStarted ||
        !audioContext
    ) {
        return;
    }


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


/* =========================================================
   MOVEMENT SOUND
   ========================================================= */

function playMoveSound() {

    playTone(
        350,
        0.08,
        "square",
        0.04
    );

}


/* =========================================================
   SCORE SOUND
   ========================================================= */

function playScoreSound() {

    playTone(
        700,
        0.08,
        "sine",
        0.04
    );


    setTimeout(() => {

        playTone(
            900,
            0.1,
            "sine",
            0.04
        );

    }, 70);

}


/* =========================================================
   CRASH SOUND
   ========================================================= */

function playCrashSound() {

    if (
        !audioContext
    ) {
        return;
    }


    /*
       Crash sound is deliberately independent
       of the engine sound.
    */

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        "sawtooth";


    oscillator.frequency.setValueAtTime(
        180,
        audioContext.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        40,
        audioContext.currentTime + 0.7
    );


    gain.gain.setValueAtTime(
        0.35,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.7
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime + 0.7
    );


    /* Impact */

    const impact =
        audioContext.createOscillator();

    const impactGain =
        audioContext.createGain();


    impact.type =
        "square";

    impact.frequency.value =
        70;


    impactGain.gain.setValueAtTime(
        0.2,
        audioContext.currentTime
    );


    impactGain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.4
    );


    impact.connect(
        impactGain
    );

    impactGain.connect(
        audioContext.destination
    );


    impact.start();

    impact.stop(
        audioContext.currentTime + 0.4
    );

}


/* =========================================================
   GAME VARIABLES
   ========================================================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const bestScoreText =
    document.getElementById("bestScore");


let playerX = 172;

let score = 0;

let speed = 5;

let gameRunning = true;

let enemies = [];

let lines = [];


/* =========================================================
   BEST SCORE
   ========================================================= */

let bestScore =
    Number(
        localStorage.getItem("bestScore")
    ) || 0;


bestScoreText.textContent =
    "Best: " + bestScore;


const roadWidth = 400;

const carWidth = 58;


/* =========================================================
   ROAD LINES
   ========================================================= */

for (
    let i = 0;
    i < 8;
    i++
) {

    const line =
        document.createElement("div");

    line.className =
        "line";

    line.style.top =
        (i * 100 - 100) + "px";

    game.appendChild(line);

    lines.push(line);

}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        startAudio();

        if (!gameRunning) return;


        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            moveLeft();

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            moveRight();

        }

    }
);


/* =========================================================
   MOVE LEFT
   ========================================================= */

function moveLeft() {

    startAudio();

    if (!gameRunning) return;


    playerX -= 30;


    if (playerX < 38) {
        playerX = 38;
    }


    player.style.left =
        playerX + "px";


    player.style.transform =
        "rotate(-3deg)";


    setTimeout(() => {

        if (gameRunning) {

            player.style.transform =
                "rotate(0deg)";

        }

    }, 100);


    playMoveSound();

}


/* =========================================================
   MOVE RIGHT
   ========================================================= */

function moveRight() {

    startAudio();

    if (!gameRunning) return;


    playerX += 30;


    if (
        playerX >
        roadWidth -
        carWidth -
        38
    ) {

        playerX =
            roadWidth -
            carWidth -
            38;

    }


    player.style.left =
        playerX + "px";


    player.style.transform =
        "rotate(3deg)";


    setTimeout(() => {

        if (gameRunning) {

            player.style.transform =
                "rotate(0deg)";

        }

    }, 100);


    playMoveSound();

}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

document
    .getElementById("left")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            startAudio();

            moveLeft();

        }
    );


document
    .getElementById("right")
    .addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            startAudio();

            moveRight();

        }
    );


document
    .getElementById("left")
    .addEventListener(
        "click",
        moveLeft
    );


document
    .getElementById("right")
    .addEventListener(
        "click",
        moveRight
    );


/* =========================================================
   ENEMY CARS
   ========================================================= */

function createEnemy() {

    if (!gameRunning) return;


    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";


    const lanes = [
        55,
        172,
        289
    ];


    const randomLane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    enemy.style.left =
        randomLane + "px";

    enemy.style.top =
        "-120px";


    /* Random colors */

    const colors = [

        "#147bd1",
        "#f0c419",
        "#20a85a",
        "#9b35d6",
        "#f07818",
        "#e63333",
        "#eeeeee"

    ];


    enemy.style.setProperty(
        "--car-color",
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ]
    );


    /* Car details */

    enemy.innerHTML = `

        <div class="wheel left"></div>
        <div class="wheel right"></div>

        <div class="wheel left rear"></div>
        <div class="wheel right rear"></div>

        <div class="headlight left"></div>
        <div class="headlight right"></div>

        <div class="taillight left"></div>
        <div class="taillight right"></div>

        <div class="mirror left"></div>
        <div class="mirror right"></div>

        <div class="door-line left"></div>
        <div class="door-line right"></div>

        <div class="door-handle left"></div>
        <div class="door-handle right"></div>

        <div class="stripe"></div>

        <div class="spoiler"></div>

        <div class="bumper"></div>

    `;


    game.appendChild(enemy);


    enemies.push({

        element: enemy,

        x: randomLane,

        y: -120,

        dx:
            (Math.random() * 2 - 1) * 2

    });

}


/* =========================================================
   COLLISION
   ========================================================= */

function collision(a, b) {

    const aRect =
        a.getBoundingClientRect();

    const bRect =
        b.getBoundingClientRect();


    return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
    );

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop() {

    if (!gameRunning) return;


    /* Road */

    lines.forEach(line => {

        let top =
            parseFloat(
                line.style.top
            );


        top += speed;


        if (top > 700) {
            top = -90;
        }


        line.style.top =
            top + "px";

    });


    /* Enemies */

    enemies.forEach(
        (enemy, index) => {

            enemy.y += speed;

            enemy.x += enemy.dx;


            if (enemy.x < 38) {

                enemy.x = 38;

                enemy.dx *= -1;

            }


            if (
                enemy.x >
                roadWidth -
                carWidth -
                38
            ) {

                enemy.x =
                    roadWidth -
                    carWidth -
                    38;

                enemy.dx *= -1;

            }


            enemy.element.style.top =
                enemy.y + "px";


            enemy.element.style.left =
                enemy.x + "px";


            enemy.element.style.transform =
                `rotate(${enemy.dx * 1.2}deg)`;


            /* Collision */

            if (
                collision(
                    player,
                    enemy.element
                )
            ) {

                endGame();

                return;

            }


            /* Remove enemy */

            if (enemy.y > 750) {

                enemy.element.remove();

                enemies.splice(
                    index,
                    1
                );


                score += 10;


                scoreText.textContent =
                    "Score: " + score;


                playScoreSound();

            }

        }
    );


    updateEngineSound();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   SPAWN ENEMIES
   ========================================================= */

setInterval(
    function() {

        if (gameRunning) {
            createEnemy();
        }

    },
    1200
);


/* =========================================================
   SCORE / DIFFICULTY
   ========================================================= */

setInterval(
    function() {

        if (!gameRunning) return;


        score++;


        scoreText.textContent =
            "Score: " + score;


        if (
            score % 50 === 0
        ) {

            speed += 0.5;

        }

    },
    1000
);


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame() {

    if (!gameRunning) return;


    /* Stop the game FIRST */

    gameRunning = false;


    /*
       Stop engine completely.
       No engine sound remains
       behind the Game Over screen.
    */

    stopEngineSound();


    /* Best score */

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "bestScore",
            bestScore
        );

    }


    /* Scores */

    finalScore.textContent =
        "Score: " + score;

    bestScoreText.textContent =
        "Best: " + bestScore;


    /* Show Game Over */

    gameOverScreen.style.display =
        "flex";


    /* Play crash sound */

    playCrashSound();

}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    /*
       Create a brand-new engine.
    */

    startAudio();


    /* Remove enemies */

    enemies.forEach(enemy => {

        enemy.element.remove();

    });


    enemies = [];


    /* Reset */

    score = 0;

    speed = 5;

    playerX = 172;


    player.style.left =
        playerX + "px";


    player.style.transform =
        "rotate(0deg)";


    scoreText.textContent =
        "Score: 0";


    gameOverScreen.style.display =
        "none";


    gameRunning = true;


    /* Start game again */

    gameLoop();

}


/* =========================================================
   START GAME
   ========================================================= */

gameLoop();

</script>
