<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Crash Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
        text-align: center;
        color: white;
    }

    #game {
        position: relative;
        width: 400px;
        height: 700px;
        max-width: 100vw;
        max-height: 100vh;
        margin: auto;
        overflow: hidden;
        background: #333;
        border-left: 8px solid #555;
        border-right: 8px solid #555;
    }

    #road {
        position: absolute;
        width: 100%;
        height: 100%;
        background:
            linear-gradient(
                to right,
                #555 0%,
                #555 8%,
                #292929 8%,
                #292929 92%,
                #555 92%,
                #555 100%
            );
    }

    .line {
        position: absolute;
        width: 8px;
        height: 90px;
        background: white;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Player car */

    #player {
        position: absolute;
        width: 55px;
        height: 95px;
        bottom: 40px;
        left: 172px;
        background: #e22;
        border-radius: 12px;
        border: 4px solid #111;
        z-index: 10;
        transition: transform 0.1s;
    }

    #player::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 32px;
        left: 6px;
        top: 10px;
        background: #55b7e8;
        border: 3px solid #111;
        border-radius: 6px;
    }

    #player::after {
        content: "";
        position: absolute;
        width: 39px;
        height: 25px;
        left: 4px;
        bottom: 8px;
        background: #333;
        border-radius: 5px;
    }

    /* Enemy cars */

    .enemy {
        position: absolute;
        width: 55px;
        height: 95px;
        background: #1685e5;
        border-radius: 12px;
        border: 4px solid #111;
        z-index: 5;
    }

    .enemy::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 32px;
        left: 6px;
        top: 10px;
        background: #9de5ff;
        border: 3px solid #111;
        border-radius: 6px;
    }

    .enemy::after {
        content: "";
        position: absolute;
        width: 39px;
        height: 25px;
        left: 4px;
        bottom: 8px;
        background: #333;
        border-radius: 5px;
    }

    #score {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 20;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px #000;
    }

    #gameOver {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    #gameOver h1 {
        color: #ff3333;
        font-size: 50px;
        margin: 10px;
    }

    #finalScore {
        font-size: 24px;
        margin: 10px;
    }

    /* Best record */

    #bestScore {
        font-size: 24px;
        margin: 5px 10px 20px;
        color: #ffd700;
        font-weight: bold;
        text-shadow: 2px 2px #000;
    }

    button {
        padding: 15px 30px;
        border: none;
        border-radius: 10px;
        background: #22cc55;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #19a947;
    }

    #controls {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 30px;
        z-index: 200;
    }

    .control {
        width: 75px;
        height: 60px;
        background: rgba(255,255,255,0.25);
        color: white;
        border: 2px solid white;
        border-radius: 12px;
        font-size: 30px;
        user-select: none;
    }

    @media (min-width: 700px) {
        #controls {
            display: none;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="score">Score: 0</div>

    <div id="player"></div>

    <div id="gameOver">

        <h1>GAME OVER</h1>

        <div id="finalScore">
            Score: 0
        </div>

        <div id="bestScore">
            Best: 0
        </div>

        <button onclick="restartGame()">
            RESTART
        </button>

    </div>

</div>

<div id="controls">

    <button class="control" id="left">
        ⬅️
    </button>

    <button class="control" id="right">
        ➡️
    </button>

</div>


<script>

/* =========================================================
   SOUND SYSTEM
   ========================================================= */

let audioContext;

let engineLow;
let engineMid;
let engineHigh;

let engineLowGain;
let engineMidGain;
let engineHighGain;

let soundStarted = false;


/* =========================================================
   START AUDIO
   ========================================================= */

function startAudio() {

    if (soundStarted) {

        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {
            audioContext.resume();
        }

        return;
    }


    audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();


    /* -----------------------------------------------------
       LOW ENGINE RUMBLE
       ----------------------------------------------------- */

    engineLow =
        audioContext.createOscillator();

    engineLowGain =
        audioContext.createGain();


    engineLow.type = "sine";

    engineLow.frequency.value = 55;

    engineLowGain.gain.value = 0.10;


    engineLow.connect(engineLowGain);

    engineLowGain.connect(
        audioContext.destination
    );


    /* -----------------------------------------------------
       MAIN ENGINE
       ----------------------------------------------------- */

    engineMid =
        audioContext.createOscillator();

    engineMidGain =
        audioContext.createGain();


    engineMid.type = "sawtooth";

    engineMid.frequency.value = 110;

    engineMidGain.gain.value = 0.025;


    engineMid.connect(engineMidGain);

    engineMidGain.connect(
        audioContext.destination
    );


    /* -----------------------------------------------------
       HIGH ENGINE HARMONIC
       ----------------------------------------------------- */

    engineHigh =
        audioContext.createOscillator();

    engineHighGain =
        audioContext.createGain();


    engineHigh.type = "triangle";

    engineHigh.frequency.value = 165;

    engineHighGain.gain.value = 0.01;


    engineHigh.connect(engineHighGain);

    engineHighGain.connect(
        audioContext.destination
    );


    /* Start engine */

    engineLow.start();

    engineMid.start();

    engineHigh.start();


    soundStarted = true;
}


/* =========================================================
   UPDATE ENGINE SOUND
   ========================================================= */

function updateEngineSound() {

    if (
        !soundStarted ||
        !audioContext
    ) {
        return;
    }


    const rpm =
        55 + speed * 14;


    const now =
        audioContext.currentTime;


    /* Low rumble */

    engineLow.frequency.setTargetAtTime(
        rpm,
        now,
        0.04
    );


    /* Main engine */

    engineMid.frequency.setTargetAtTime(
        rpm * 2,
        now,
        0.04
    );


    /* Higher harmonic */

    engineHigh.frequency.setTargetAtTime(
        rpm * 3,
        now,
        0.04
    );


    /* Engine volume */

    const lowVolume =
        0.10 + speed * 0.003;

    const midVolume =
        0.025 + speed * 0.002;

    const highVolume =
        0.01 + speed * 0.001;


    engineLowGain.gain.setTargetAtTime(
        Math.min(lowVolume, 0.18),
        now,
        0.08
    );


    engineMidGain.gain.setTargetAtTime(
        Math.min(midVolume, 0.07),
        now,
        0.08
    );


    engineHighGain.gain.setTargetAtTime(
        Math.min(highVolume, 0.04),
        now,
        0.08
    );
}


/* =========================================================
   STOP ENGINE SOUND
   ========================================================= */

function stopEngineSound() {

    if (
        !soundStarted ||
        !audioContext
    ) {
        return;
    }


    const now =
        audioContext.currentTime;


    /*
        Fade the engine out very quickly
        when the player crashes.
    */

    engineLowGain.gain.cancelScheduledValues(now);

    engineMidGain.gain.cancelScheduledValues(now);

    engineHighGain.gain.cancelScheduledValues(now);


    engineLowGain.gain.setTargetAtTime(
        0,
        now,
        0.025
    );


    engineMidGain.gain.setTargetAtTime(
        0,
        now,
        0.025
    );


    engineHighGain.gain.setTargetAtTime(
        0,
        now,
        0.025
    );
}


/* =========================================================
   SHORT SOUND EFFECT
   ========================================================= */

function playTone(
    frequency,
    duration,
    type = "square",
    volume = 0.08
) {

    if (!soundStarted) return;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type = type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime + duration
    );
}


/* =========================================================
   MOVEMENT SOUND
   ========================================================= */

function playMoveSound() {

    playTone(
        350,
        0.08,
        "square",
        0.04
    );
}


/* =========================================================
   SCORE SOUND
   ========================================================= */

function playScoreSound() {

    playTone(
        700,
        0.08,
        "sine",
        0.04
    );


    setTimeout(() => {

        playTone(
            900,
            0.1,
            "sine",
            0.04
        );

    }, 70);
}


/* =========================================================
   CRASH SOUND
   ========================================================= */

function playCrashSound() {

    if (!soundStarted) return;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        "sawtooth";


    oscillator.frequency.setValueAtTime(
        180,
        audioContext.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        40,
        audioContext.currentTime + 0.7
    );


    gain.gain.setValueAtTime(
        0.35,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.7
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime + 0.7
    );


    /* Crash impact */

    playTone(
        70,
        0.4,
        "square",
        0.2
    );
}


/* =========================================================
   GAME VARIABLES
   ========================================================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const bestScoreText =
    document.getElementById("bestScore");


let playerX = 172;

let score = 0;

let speed = 5;

let gameRunning = true;

let enemies = [];

let lines = [];


/* =========================================================
   BEST RECORD
   ========================================================= */

let bestScore =
    Number(
        localStorage.getItem("bestScore")
    ) || 0;


bestScoreText.textContent =
    "Best: " + bestScore;


const roadWidth = 400;

const carWidth = 55;


/* =========================================================
   ROAD LINES
   ========================================================= */

for (let i = 0; i < 8; i++) {

    const line =
        document.createElement("div");

    line.className = "line";

    line.style.top =
        (i * 100 - 100) + "px";

    game.appendChild(line);

    lines.push(line);
}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        startAudio();

        if (!gameRunning) return;


        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            moveLeft();
        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            moveRight();
        }

    }
);


/* =========================================================
   MOVE LEFT
   ========================================================= */

function moveLeft() {

    startAudio();


    if (!gameRunning) return;


    playerX -= 30;


    if (playerX < 38) {

        playerX = 38;
    }


    player.style.left =
        playerX + "px";


    playMoveSound();
}


/* =========================================================
   MOVE RIGHT
   ========================================================= */

function moveRight() {

    startAudio();


    if (!gameRunning) return;


    playerX += 30;


    if (
        playerX >
        roadWidth - carWidth - 38
    ) {

        playerX =
            roadWidth - carWidth - 38;
    }


    player.style.left =
        playerX + "px";


    playMoveSound();
}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

document.getElementById("left")
.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        startAudio();

        moveLeft();
    }
);


document.getElementById("right")
.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        startAudio();

        moveRight();
    }
);


document.getElementById("left")
.addEventListener(
    "click",
    moveLeft
);


document.getElementById("right")
.addEventListener(
    "click",
    moveRight
);


/* =========================================================
   ENEMY CARS
   ========================================================= */

function createEnemy() {

    if (!gameRunning) return;


    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";


    const lanes = [
        55,
        172,
        289
    ];


    const randomLane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    enemy.style.left =
        randomLane + "px";


    enemy.style.top =
        "-120px";


    game.appendChild(enemy);


    enemies.push({

        element: enemy,

        x: randomLane,

        y: -120,

        dx:
            (Math.random() * 2 - 1) * 2

    });
}


/* =========================================================
   COLLISION
   ========================================================= */

function collision(a, b) {

    const aRect =
        a.getBoundingClientRect();

    const bRect =
        b.getBoundingClientRect();


    return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
    );
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop() {

    if (!gameRunning) return;


    /* Move road */

    lines.forEach(line => {

        let top =
            parseFloat(
                line.style.top
            );


        top += speed;


        if (top > 700) {

            top = -90;
        }


        line.style.top =
            top + "px";

    });


    /* Move enemies */

    enemies.forEach(
        (enemy, index) => {

            enemy.y += speed;


            enemy.x += enemy.dx;


            /* Keep enemy inside road */

            if (enemy.x < 38) {

                enemy.x = 38;

                enemy.dx *= -1;
            }


            if (
                enemy.x >
                roadWidth -
                carWidth -
                38
            ) {

                enemy.x =
                    roadWidth -
                    carWidth -
                    38;

                enemy.dx *= -1;
            }


            enemy.element.style.top =
                enemy.y + "px";


            enemy.element.style.left =
                enemy.x + "px";


            /* Crash */

            if (
                collision(
                    player,
                    enemy.element
                )
            ) {

                endGame();

                return;
            }


            /* Remove enemy */

            if (enemy.y > 750) {

                enemy.element.remove();

                enemies.splice(
                    index,
                    1
                );


                score += 10;


                scoreText.textContent =
                    "Score: " + score;


                playScoreSound();
            }

        }
    );


    /* Update engine */

    updateEngineSound();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   SPAWN ENEMIES
   ========================================================= */

setInterval(
    function() {

        if (gameRunning) {

            createEnemy();
        }

    },
    1200
);


/* =========================================================
   SCORE / DIFFICULTY
   ========================================================= */

setInterval(
    function() {

        if (!gameRunning) return;


        score++;


        scoreText.textContent =
            "Score: " + score;


        if (score % 50 === 0) {

            speed += 0.5;
        }

    },
    1000
);


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame() {

    if (!gameRunning) return;


    gameRunning = false;


    /* -----------------------------------------------
       STOP ENGINE
       ----------------------------------------------- */

    stopEngineSound();


    /* -----------------------------------------------
       CHECK BEST SCORE
       ----------------------------------------------- */

    if (score > bestScore) {

        bestScore = score;


        localStorage.setItem(
            "bestScore",
            bestScore
        );
    }


    /* -----------------------------------------------
       SHOW SCORES
       ----------------------------------------------- */

    finalScore.textContent =
        "Score: " + score;


    bestScoreText.textContent =
        "Best: " + bestScore;


    gameOverScreen.style.display =
        "flex";


    /* Crash sound */

    playCrashSound();
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    startAudio();


    /* Reset engine volume */

    if (
        soundStarted &&
        audioContext
    ) {

        const now =
            audioContext.currentTime;


        engineLowGain.gain.setTargetAtTime(
            0.10,
            now,
            0.03
        );


        engineMidGain.gain.setTargetAtTime(
            0.025,
            now,
            0.03
        );


        engineHighGain.gain.setTargetAtTime(
            0.01,
            now,
            0.03
        );
    }


    /* Remove enemies */

    enemies.forEach(enemy => {

        enemy.element.remove();
    });


    enemies = [];


    /* Reset game */

    score = 0;

    speed = 5;

    playerX = 172;


    player.style.left =
        playerX + "px";


    scoreText.textContent =
        "Score: 0";


    gameOverScreen.style.display =
        "none";


    gameRunning = true;


    gameLoop();
}


/* =========================================================
   START GAME
   ========================================================= */

gameLoop();

</script>

</body>
</html>
